<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Keke Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Pin Babel 7: unpinned unpkg now resolves to Babel 8, which emits ESM and breaks in-browser JSX -->
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-gray-100 dark:bg-gray-900">
  <div id="root"></div>
  <script>window.ADMIN_API_BASE_URL = 'https://api.getkekeapp.com';</script>

  <!-- Config: API runs on port 8000. Override with window.ADMIN_API_BASE_URL if needed. -->
  <script>
    (function() {
      var host = window.location.hostname;
      var isLocal = host === 'localhost' || host === '127.0.0.1';
      var apiBase = window.ADMIN_API_BASE_URL;
      if (!apiBase)
        apiBase = isLocal ? 'http://localhost:8000' : (window.location.protocol + '//' + host + ':8000');
      window.__CONFIG__ = { API_BASE_URL: apiBase };
    })();
  </script>

  <!-- Utils, API, Auth (plain JS, order matters) -->
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>

  <!-- Components (JSX) -->
  <script type="text/babel" src="components/index.jsx"></script>

  <!-- Pages (JSX) - each adds to window.AdminPages -->
  <script type="text/babel" src="pages/Dashboard.jsx"></script>
  <script type="text/babel" src="pages/Users.jsx"></script>
  <script type="text/babel" src="pages/Drivers.jsx"></script>
  <script type="text/babel" src="pages/Rides.jsx"></script>
  <script type="text/babel" src="pages/Finance.jsx"></script>
  <script type="text/babel" src="pages/Support.jsx"></script>
  <script type="text/babel" src="pages/Config.jsx"></script>
  <script type="text/babel" src="pages/Analytics.jsx"></script>
  <script type="text/babel" src="pages/Notifications.jsx"></script>
  <script type="text/babel" src="pages/Audit.jsx"></script>

  <!-- App (JSX) -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
