<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keke Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // API Configuration
        const API_BASE_URL = 'http://localhost:8000/api';

        const AdminDashboard = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [stats, setStats] = useState(null);
            const [users, setUsers] = useState([]);
            const [drivers, setDrivers] = useState([]);
            const [rides, setRides] = useState([]);
            const [loading, setLoading] = useState(false);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [authToken, setAuthToken] = useState(localStorage.getItem('adminToken'));

            useEffect(() => {
                if (authToken) {
                    setIsLoggedIn(true);
                    fetchDashboardData();
                }
            }, [authToken]);

            const handleLogin = async (e) => {
                e.preventDefault();
                const email = e.target.email.value;
                const password = e.target.password.value;

                try {
                    const response = await fetch(`${API_BASE_URL}/admin/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        localStorage.setItem('adminToken', data.authorisation.token);
                        setAuthToken(data.authorisation.token);
                        setIsLoggedIn(true);
                    } else {
                        alert('Login failed: ' + (data.message || 'Invalid credentials'));
                    }
                } catch (error) {
                    alert('Login error: ' + error.message);
                }
            };

            const fetchDashboardData = async () => {
                setLoading(true);
                try {
                    const headers = {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    };

                    const [statsRes, usersRes, driversRes, ridesRes] = await Promise.all([
                        fetch(`${API_BASE_URL}/admin/dashboard/stats`, { headers }),
                        fetch(`${API_BASE_URL}/admin/users?limit=10`, { headers }),
                        fetch(`${API_BASE_URL}/admin/drivers?limit=10`, { headers }),
                        fetch(`${API_BASE_URL}/admin/rides?limit=10`, { headers })
                    ]);

                    const statsData = await statsRes.json();
                    const usersData = await usersRes.json();
                    const driversData = await driversRes.json();
                    const ridesData = await ridesRes.json();

                    setStats(statsData.data || {});
                    setUsers(usersData.data?.users || []);
                    setDrivers(driversData.data?.drivers || []);
                    setRides(ridesData.data?.rides || []);
                } catch (error) {
                    console.error('Error fetching data:', error);
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('adminToken');
                setAuthToken(null);
                setIsLoggedIn(false);
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center p-4">
                        <div className="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-bold text-gray-800">🚗 Keke Admin</h1>
                                <p className="text-gray-600 mt-2">Ride-Hailing Management</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Email
                                    </label>
                                    <input
                                        type="email"
                                        name="email"
                                        defaultValue="admin@keke.com"
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Password
                                    </label>
                                    <input
                                        type="password"
                                        name="password"
                                        defaultValue="Admin@123456"
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        required
                                    />
                                </div>
                                <button
                                    type="submit"
                                    className="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors font-medium"
                                >
                                    Login
                                </button>
                            </form>
                            <div className="mt-4 text-center text-sm text-gray-600">
                                <p>Test Credentials:</p>
                                <p>admin@keke.com / Admin@123456</p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100">
                    {/* Header */}
                    <header className="bg-white shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 className="text-2xl font-bold text-gray-800">🚗 Keke Admin Dashboard</h1>
                            <button
                                onClick={handleLogout}
                                className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
                            >
                                Logout
                            </button>
                        </div>
                    </header>

                    {/* Navigation */}
                    <nav className="bg-white border-b">
                        <div className="max-w-7xl mx-auto px-4">
                            <div className="flex space-x-8">
                                {['dashboard', 'users', 'drivers', 'rides'].map((tab) => (
                                    <button
                                        key={tab}
                                        onClick={() => setActiveTab(tab)}
                                        className={`py-4 px-2 border-b-2 font-medium text-sm capitalize transition-colors ${
                                            activeTab === tab
                                                ? 'border-blue-500 text-blue-600'
                                                : 'border-transparent text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        {tab}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    {/* Content */}
                    <main className="max-w-7xl mx-auto px-4 py-8">
                        {loading ? (
                            <div className="flex justify-center items-center h-64">
                                <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
                            </div>
                        ) : (
                            <>
                                {activeTab === 'dashboard' && (
                                    <div className="space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                            <StatCard
                                                title="Total Users"
                                                value={stats?.totalUsers || 0}
                                                icon="👥"
                                                color="blue"
                                            />
                                            <StatCard
                                                title="Active Drivers"
                                                value={stats?.activeDrivers || 0}
                                                icon="🚗"
                                                color="green"
                                            />
                                            <StatCard
                                                title="Total Rides"
                                                value={stats?.totalRides || 0}
                                                icon="🗺️"
                                                color="purple"
                                            />
                                            <StatCard
                                                title="Revenue"
                                                value={`$${stats?.totalRevenue || 0}`}
                                                icon="💰"
                                                color="yellow"
                                            />
                                        </div>

                                        <div className="bg-white rounded-lg shadow p-6">
                                            <h2 className="text-xl font-bold text-gray-800 mb-4">
                                                System Status
                                            </h2>
                                            <div className="space-y-3">
                                                <StatusItem
                                                    label="Backend API"
                                                    status="online"
                                                    url={API_BASE_URL}
                                                />
                                                <StatusItem
                                                    label="Database"
                                                    status={stats ? 'online' : 'offline'}
                                                />
                                                <StatusItem
                                                    label="Real-time Socket"
                                                    status="online"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'users' && (
                                    <div className="bg-white rounded-lg shadow overflow-hidden">
                                        <div className="px-6 py-4 border-b">
                                            <h2 className="text-xl font-bold text-gray-800">Users</h2>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="min-w-full divide-y divide-gray-200">
                                                <thead className="bg-gray-50">
                                                    <tr>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Name
                                                        </th>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Email
                                                        </th>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Phone
                                                        </th>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Status
                                                        </th>
                                                    </tr>
                                                </thead>
                                                <tbody className="bg-white divide-y divide-gray-200">
                                                    {users.length === 0 ? (
                                                        <tr>
                                                            <td colSpan="4" className="px-6 py-4 text-center text-gray-500">
                                                                No users found
                                                            </td>
                                                        </tr>
                                                    ) : (
                                                        users.map((user) => (
                                                            <tr key={user._id}>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    {user.firstName} {user.lastName}
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    {user.email}
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    {user.phone}
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    <span
                                                                        className={`px-2 py-1 text-xs rounded-full ${
                                                                            user.isActive
                                                                                ? 'bg-green-100 text-green-800'
                                                                                : 'bg-red-100 text-red-800'
                                                                        }`}
                                                                    >
                                                                        {user.isActive ? 'Active' : 'Inactive'}
                                                                    </span>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'drivers' && (
                                    <div className="bg-white rounded-lg shadow overflow-hidden">
                                        <div className="px-6 py-4 border-b">
                                            <h2 className="text-xl font-bold text-gray-800">Drivers</h2>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="min-w-full divide-y divide-gray-200">
                                                <thead className="bg-gray-50">
                                                    <tr>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Name
                                                        </th>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Vehicle
                                                        </th>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Status
                                                        </th>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Rating
                                                        </th>
                                                    </tr>
                                                </thead>
                                                <tbody className="bg-white divide-y divide-gray-200">
                                                    {drivers.length === 0 ? (
                                                        <tr>
                                                            <td colSpan="4" className="px-6 py-4 text-center text-gray-500">
                                                                No drivers found
                                                            </td>
                                                        </tr>
                                                    ) : (
                                                        drivers.map((driver) => (
                                                            <tr key={driver._id}>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    {driver.userId?.firstName} {driver.userId?.lastName}
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    {driver.vehicleDetails?.make} {driver.vehicleDetails?.model}
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    <span
                                                                        className={`px-2 py-1 text-xs rounded-full ${
                                                                            driver.isOnline
                                                                                ? 'bg-green-100 text-green-800'
                                                                                : 'bg-gray-100 text-gray-800'
                                                                        }`}
                                                                    >
                                                                        {driver.isOnline ? 'Online' : 'Offline'}
                                                                    </span>
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    ⭐ {driver.rating || 'N/A'}
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'rides' && (
                                    <div className="bg-white rounded-lg shadow overflow-hidden">
                                        <div className="px-6 py-4 border-b">
                                            <h2 className="text-xl font-bold text-gray-800">Recent Rides</h2>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="min-w-full divide-y divide-gray-200">
                                                <thead className="bg-gray-50">
                                                    <tr>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Rider
                                                        </th>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Driver
                                                        </th>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Status
                                                        </th>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                                            Fare
                                                        </th>
                                                    </tr>
                                                </thead>
                                                <tbody className="bg-white divide-y divide-gray-200">
                                                    {rides.length === 0 ? (
                                                        <tr>
                                                            <td colSpan="4" className="px-6 py-4 text-center text-gray-500">
                                                                No rides found
                                                            </td>
                                                        </tr>
                                                    ) : (
                                                        rides.map((ride) => (
                                                            <tr key={ride._id}>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    {ride.riderId?.firstName} {ride.riderId?.lastName}
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    {ride.driverId?.userId?.firstName || 'N/A'}
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    <span className="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800 capitalize">
                                                                        {ride.status}
                                                                    </span>
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    ${ride.fare?.toFixed(2) || '0.00'}
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </main>
                </div>
            );
        };

        const StatCard = ({ title, value, icon, color }) => {
            const colors = {
                blue: 'bg-blue-500',
                green: 'bg-green-500',
                purple: 'bg-purple-500',
                yellow: 'bg-yellow-500'
            };

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <div className="flex items-center justify-between">
                        <div>
                            <p className="text-sm text-gray-600">{title}</p>
                            <p className="text-2xl font-bold text-gray-800 mt-2">{value}</p>
                        </div>
                        <div className={`${colors[color]} w-12 h-12 rounded-full flex items-center justify-center text-2xl`}>
                            {icon}
                        </div>
                    </div>
                </div>
            );
        };

        const StatusItem = ({ label, status, url }) => (
            <div className="flex items-center justify-between py-2">
                <div>
                    <p className="font-medium text-gray-800">{label}</p>
                    {url && <p className="text-xs text-gray-500">{url}</p>}
                </div>
                <span
                    className={`px-3 py-1 rounded-full text-sm ${
                        status === 'online'
                            ? 'bg-green-100 text-green-800'
                            : 'bg-red-100 text-red-800'
                    }`}
                >
                    {status}
                </span>
            </div>
        );

        ReactDOM.render(<AdminDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
