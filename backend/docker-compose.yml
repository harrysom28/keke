version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: ride-hailing-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: keke-ride-hailing
    volumes:
      - mongodb_data:/data/db
    networks:
      - ride-hailing-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ride-hailing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ride-hailing-network

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ride-hailing-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8000"
      TRUST_PROXY: "1"
      # These can be overridden by Dokploy / .env at deploy time
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:password123@mongodb:27017/keke-ride-hailing?authSource=admin}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # 4-photo driver create: allow Cloudinary uploads up to 180s each
      CLOUDINARY_UPLOAD_TIMEOUT_MS: ${CLOUDINARY_UPLOAD_TIMEOUT_MS:-180000}
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - ride-hailing-network
    # Dokploy/Traefik: see deploy/proxy-timeouts.md — raise body size to 50m
    # and read/write timeouts to 180s on the reverse proxy in front of this service.
    # labels:
    #   - "traefik.http.middlewares.driver-upload-buffering.buffering.maxRequestBodyBytes=52428800"

volumes:
  mongodb_data:
  redis_data:

networks:
  ride-hailing-network:
    driver: bridge
