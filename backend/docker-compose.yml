version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: ride-hailing-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: keke-ride-hailing
    volumes:
      - mongodb_data:/data/db
    networks:
      - ride-hailing-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ride-hailing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ride-hailing-network

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ride-hailing-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/keke-ride-hailing?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRUST_PROXY: "1"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - ride-hailing-network

volumes:
  mongodb_data:
  redis_data:

networks:
  ride-hailing-network:
    driver: bridge
